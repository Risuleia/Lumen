# Lumen configuration
# Save this file and restart Lumen for changes to take effect.

[island]
# Size multiplier for the island (min = 0.5, max = 1.5)
scale = 1.0
# Vertical offset from the top of the screen, in pixels (min = 2, max = 20)
y_offset = 8
# Hide the island completely, even when something is playing
completely_hidden = false
# Draw a drop shadow under the island
shadows = true

[notifications]
# How long a notification stays visible, in milliseconds (min = 500, max = 10000)
timeout_ms = 3000
# Hide the native Windows notification toasts while Lumen is running
suppress_native_toasts = false